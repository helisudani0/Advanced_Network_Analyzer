name: deploy-product-site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run typecheck
      - name: Build static product site
        run: npm run build:site
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_DOWNLOAD_BASE_URL: https://github.com/${{ github.repository }}/releases/latest/download
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/marketing/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
