services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ravynel
      POSTGRES_USER: ravynel
      POSTGRES_PASSWORD: ravynel_dev
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  control-plane:
    build:
      context: ../..
      dockerfile: infra/docker/control-plane.Dockerfile
    environment:
      RAVYNEL_HTTP_ADDR: ":8088"
      RAVYNEL_GRPC_ADDR: ":9443"
      DATABASE_URL: postgres://ravynel:ravynel_dev@postgres:5432/ravynel?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
    ports: ["8088:8088", "9443:9443"]
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ../nginx/ravynel.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:80"]
    depends_on: [control-plane]
volumes:
  postgres-data:
