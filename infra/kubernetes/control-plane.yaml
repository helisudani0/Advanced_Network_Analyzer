apiVersion: apps/v1
kind: Deployment
metadata:
  name: ravynel-control-plane
  labels: { app: ravynel-control-plane }
spec:
  replicas: 2
  selector: { matchLabels: { app: ravynel-control-plane } }
  template:
    metadata: { labels: { app: ravynel-control-plane } }
    spec:
      containers:
        - name: control-plane
          image: ravynel/control-plane:0.1.0
          ports:
            - { containerPort: 8088, name: http }
            - { containerPort: 9443, name: grpc }
          env:
            - { name: RAVYNEL_HTTP_ADDR, value: ":8088" }
            - { name: RAVYNEL_GRPC_ADDR, value: ":9443" }
          readinessProbe:
            httpGet: { path: /health, port: 8088 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ravynel-control-plane
spec:
  selector: { app: ravynel-control-plane }
  ports:
    - { name: http, port: 8088, targetPort: 8088 }
    - { name: grpc, port: 9443, targetPort: 9443 }
