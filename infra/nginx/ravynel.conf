server {
  listen 80;
  server_name _;
  client_max_body_size 64m;
  location /api/ {
    proxy_pass http://control-plane:8088/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /health {
    proxy_pass http://control-plane:8088/health;
  }
}
